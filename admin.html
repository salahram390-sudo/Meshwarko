<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مشوارك - لوحة الإدارة</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <style>
    .admin-shell{max-width:1280px;margin:0 auto}
    .admin-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .admin-tools{display:flex;gap:10px;flex-wrap:wrap}
    .admin-tools .input,.admin-tools select{min-width:180px}
    .admin-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .admin-stat{padding:14px;border-radius:18px;border:1px solid rgba(255,215,0,.14);background:rgba(255,255,255,.03)}
    .admin-stat .label{font-size:12px;color:var(--muted)}
    .admin-stat .value{font-size:24px;font-weight:800;color:#FFD700;margin-top:6px}
    .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .admin-tab{
      height:40px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,215,0,.14);
      background:rgba(255,255,255,.03);color:#fff;cursor:pointer
    }
    .admin-tab.active{
      background:linear-gradient(180deg,#ffd54a,#ffb300);
      color:#111;border-color:transparent;font-weight:800
    }
    .admin-pane{display:none}
    .admin-pane.active{display:block}
    .admin-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .admin-empty{padding:18px;text-align:center;color:var(--muted)}
    .admin-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
    .admin-badge{
      display:inline-flex;align-items:center;justify-content:center;
      padding:4px 10px;border-radius:999px;font-size:11px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)
    }
    .admin-badge.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35)}
    .admin-badge.warn{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}
    .admin-badge.info{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.35)}
    .admin-meta{display:flex;flex-direction:column;gap:4px}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .admin-actions .btn{min-width:110px}
    .admin-mini{font-size:12px;color:var(--muted)}
    .admin-row-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    @media (max-width:900px){
      .admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .admin-grid-2{grid-template-columns:1fr}
    }
    @media (max-width:640px){
      .admin-stats{grid-template-columns:1fr 1fr}
      .admin-tools{width:100%}
      .admin-tools .input,.admin-tools select{flex:1;min-width:0}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="user-avatar">
  <img src="assets/avatar.png" alt="User">
</div>
        <div>
          <div class="brand-title">مشوارك</div>
          <div class="brand-sub">لوحة إدارة سرية</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="adminBadge" class="badge">...</span>
        <button id="logoutBtn" class="btn ghost small" type="button">خروج</button>
      </div>
    </header>

    <main class="auth-container" style="padding:16px; display:block;">
      <section class="card admin-shell">

        <div class="panel-title">لوحة التحكم</div>

        <div class="admin-top" style="margin-top:14px">
          <div class="admin-tools">
            <input id="adminSearch" class="input" type="text" placeholder="بحث بالاسم / الإيميل / الهاتف..." />
            <select id="adminUserFilter" class="input">
              <option value="all">كل المستخدمين</option>
              <option value="driver">السائقون</option>
              <option value="passenger">الركاب</option>
              <option value="admin">الأدمنز</option>
              <option value="blocked">المحظورون</option>
            </select>
            <select id="adminRideFilter" class="input">
              <option value="all">كل الرحلات</option>
              <option value="active">الرحلات النشطة</option>
              <option value="completed">الرحلات المكتملة</option>
              <option value="canceled">الرحلات الملغية</option>
            </select>
          </div>
        </div>

        <div id="adminStats" class="admin-stats" style="margin-top:14px"></div>

        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="overview" type="button">نظرة عامة</button>
          <button class="admin-tab" data-tab="users" type="button">المستخدمون</button>
          <button class="admin-tab" data-tab="rides" type="button">الرحلات</button>
          <button class="admin-tab" data-tab="online" type="button">السائقون المتصلون</button>
          <button class="admin-tab" data-tab="admins" type="button">إدارة الأدمنز</button>
        </div>

        <div id="pane-overview" class="admin-pane active">
          <div class="admin-grid-2">
            <div class="card-lite">
              <div class="panel-title">آخر المستخدمين</div>
              <div id="recentUsersList" class="list" style="margin-top:12px"></div>
            </div>
            <div class="card-lite">
              <div class="panel-title">آخر الرحلات</div>
              <div id="recentRidesList" class="list" style="margin-top:12px"></div>
            </div>
          </div>
        </div>

        <div id="pane-users" class="admin-pane">
          <div class="panel-title">إدارة المستخدمين</div>
          <div id="usersList" class="list" style="margin-top:12px"></div>
        </div>

        <div id="pane-rides" class="admin-pane">
          <div class="panel-title">إدارة الرحلات</div>
          <div id="ridesList" class="list" style="margin-top:12px"></div>
        </div>

        <div id="pane-online" class="admin-pane">
          <div class="panel-title">السائقون المتصلون الآن</div>
          <div id="driversOnlineList" class="list" style="margin-top:12px"></div>
        </div>

        <div id="pane-admins" class="admin-pane">
          <div class="panel-title">إدارة الأدمنز</div>

          <div class="admin-row-tools" style="margin-top:12px">
            <button id="makeAdminBtn" class="btn success small" type="button">➕ إضافة أدمن بالإيميل</button>
          </div>

          <div id="adminsList" class="list" style="margin-top:12px"></div>
        </div>

      </section>
    </main>

    <div id="toastRoot"></div>
  </div>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
