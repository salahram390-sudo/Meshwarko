<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مشوارك - السائق</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">M</div>
        <div>
          <div class="brand-title">مشوارك</div>
          <div class="brand-sub">واجهة السائق</div>
        </div>
      </div>
      <div class="top-actions">
        <span id="meBadge" class="badge">...</span>
        <button id="editProfileBtn" class="btn ghost small" type="button">تعديل البيانات</button>
        <button id="switchRoleBtn" class="btn ghost small" type="button">تحويل لراكب</button>
        <button id="logoutBtn" class="btn ghost small" type="button">خروج</button>
      </div>
    </header>

    <main class="map-layout">
      <section class="map-area">
        <div id="map" class="map"></div>
        <div class="map-fabs">
          <button id="btnLocate" class="fab" title="موقعي">📍</button>
          <button id="btnClear" class="fab" title="مسح">✖</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">طلبات متاحة (نفس المحافظة/المركز)</div>
            <div class="panel-sub" id="subText">اختر طلب ثم اقبل أو اقترح سعر</div>
          </div>
          <span class="pill-status" id="driverStatus">متصل</span>
        </div>

        <div class="panel-body">
          <div class="card-lite">
            <div class="row-between">
              <div class="panel-title">قائمة الطلبات</div>
              <button id="btnRefresh" class="btn ghost small" type="button">تحديث</button>
            </div>
            <div id="ridesList" class="list"></div>
          </div>

          <div class="divider"></div>

          <div class="card-lite">
            <div class="panel-title">الطلب المحدد</div>
            <div id="selectedRide" class="ride-card">
              <div class="muted">لم يتم تحديد طلب.</div>
            </div>

            <div class="form-row" style="margin-top:10px">
              <label class="label">اقتراح سعر (اختياري)</label>
              <input id="offerInput" class="input" type="number" min="15" max="3000" step="5" placeholder="مثال: 80" />
              <p class="hint">لو كتبت سعر واضغط إرسال، هيروح للراكب كـ عرض.</p>
            </div>

            <div class="actions">
              <button id="btnSendOffer" class="btn primary" type="button" disabled>إرسال عرض سعر</button>
              <button id="btnAccept" class="btn success" type="button" disabled>قبول بسعر الطلب</button>
              <button id="btnTrackToggle" class="btn ghost" type="button" disabled>ابدأ التتبع</button>
              <button id="btnCancel" class="btn danger" type="button" disabled>إلغاء</button>
              <button id="btnArrived" class="btn primary" type="button" disabled>وصلت</button>
              <button id="btnComplete" class="btn success" type="button" disabled>إنهاء</button>
            </div>
          </div>

          <div class="spacer"></div>
        </div>
      </section>
    </main>

    <div id="toastRoot"></div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/driver.js"></script>
  <script>
  (function () {
    var s = document.createElement('script');
    s.src = "https://cdn.jsdelivr.net/npm/eruda";
    s.onload = function () { eruda.init(); };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
