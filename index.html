<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مشوارك - تسجيل</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div id="splash" class="splash-screen">
    <div class="splash-logo-wrap">
      <img src="./assets/logo.png" alt="مشوارك" class="splash-logo" />
    </div>
  </div>

  <div id="appRoot" class="app-shell auth-shell app-hidden">
    <!-- باقي الصفحة زي ما هي -->
  </div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const splash = document.getElementById("splash");
  const logo = splash?.querySelector(".splash-logo");
  const appRoot = document.getElementById("appRoot");

  if (!splash || !logo || !appRoot) return;

  setTimeout(() => {
    logo.classList.add("hide");
  }, 3200);

  setTimeout(() => {
    splash.classList.add("hide");
  }, 5600);

  setTimeout(() => {
    splash.remove();
    appRoot.classList.remove("app-hidden");
    appRoot.classList.add("app-ready");
  }, 6600);
});
</script>

</body>
</html>
